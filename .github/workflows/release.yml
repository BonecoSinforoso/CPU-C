name: Release

# Push a tag such as v0.1.0 to build the .exe and create the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file exe
        shell: pwsh
        run: >
          dotnet publish src/CPU-C/CPU-C.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=$("${{ github.ref_name }}".TrimStart('v'))
          -o publish

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/CPU-C.exe
          generate_release_notes: true
